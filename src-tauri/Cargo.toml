[package]
name = "tau-omega"
version = "0.3.0"
edition = "2024"

[workspace]

[dependencies]
tau-core = { path = "../crates/tau-core", features = ["serde"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[target.'cfg(unix)'.dependencies]
# Already in the tree through sha2/rustix/errno (no new compile cost); used only by
# cacheflush.rs for the platform call that drops a file's cached pages.
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
