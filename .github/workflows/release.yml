name: Release
# Builds the installers for a tag (v*) or on demand, and attaches them to a DRAFT GitHub release with SHA256SUMS.
# Nothing is published until you publish the draft by hand.
#
# Signing is optional and switches on by itself when the secrets exist (Settings > Secrets and variables > Actions):
#   macOS    APPLE_CERTIFICATE (base64 of the Developer ID Application .p12), APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"), APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
#   Updater  TAURI_SIGNING_PRIVATE_KEY (the contents of ~/.tauri/tau-omega-updater.key), TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty for the
#            current key). With it the bundles are signed for the in-app updater and latest.json is attached; without it no update is published.
# Without them the installers are unsigned (macOS Gatekeeper and Windows SmartScreen will warn on first run).
# Windows code signing is not wired: it needs a certificate or a signing service; see docs/RELEASING.md.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS-Apple-silicon, os: macos-latest, target: aarch64-apple-darwin, bundles: 'app,dmg', arch: aarch64 }
          - { name: macOS-Intel, os: macos-13, target: x86_64-apple-darwin, bundles: 'app,dmg', arch: x64 }
          - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc, bundles: 'nsis,msi' }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'appimage,deb' }
    runs-on: ${{ matrix.os }}
    env:
      HAVE_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAVE_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci && npm run build
        working-directory: ui
      - name: Build installers (signed and notarised)
        if: runner.os == 'macOS' && env.HAVE_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          CFG='{"build":{"beforeBuildCommand":""}}'
          [ "$HAVE_UPDATER_KEY" = "true" ] && CFG='{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":true}}'
          npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$CFG"
        working-directory: src-tauri
      - name: Build installers (unsigned)
        if: runner.os != 'macOS' || env.HAVE_APPLE != 'true'
        shell: bash
        run: |
          CFG='{"build":{"beforeBuildCommand":""}}'
          [ "$HAVE_UPDATER_KEY" = "true" ] && CFG='{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":true}}'
          npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$CFG"
        working-directory: src-tauri
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          B=target/${{ matrix.target }}/release/bundle
          for f in $B/dmg/*.dmg $B/nsis/*.exe $B/nsis/*.exe.sig $B/msi/*.msi $B/appimage/*.AppImage $B/appimage/*.AppImage.sig $B/deb/*.deb; do
            [ -f "$f" ] && cp "$f" "out/$(basename "$f" | tr ' ' '_')"
          done
          # the macOS updater bundle has the same name on both architectures: add the architecture
          for f in $B/macos/*.app.tar.gz $B/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && cp "$f" "out/Tau_Omega_${{ matrix.arch }}.$(basename "$f" | sed 's/^.*\.app/app/')"
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: Tau-Omega-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls dist/*.sig >/dev/null 2>&1; then python3 tools/make_latest_json.py dist "${{ github.ref_name }}" "${{ github.repository }}" >/dev/null; else echo "no updater signatures: latest.json not made, no in-app update is published"; fi
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft --title "Tau Omega ${{ github.ref_name }}" --generate-notes *
