name: Build app
# Builds downloadable desktop apps. Run it from the Actions tab (Run workflow),
# or it runs on every push to the session branch. Artifacts appear at the
# bottom of the run page. These builds are unsigned.
on:
  workflow_dispatch:
  push:
    branches: [claude/jolly-meitner-jwdzwx]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS-Apple-silicon, os: macos-latest, target: aarch64-apple-darwin, bundles: app }
          - { name: macOS-Intel, os: macos-13, target: x86_64-apple-darwin, bundles: app }
          - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: appimage }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci && npm run build
        working-directory: ui
      - run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"build":{"beforeBuildCommand":""}}'
        working-directory: src-tauri
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: cd target/${{ matrix.target }}/release/bundle/macos && ditto -c -k --keepParent "Tau Omega.app" "$GITHUB_WORKSPACE/Tau-Omega-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Tau-Omega-${{ matrix.name }}
          path: Tau-Omega-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: Tau-Omega-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/bundle/*/*
