name: Verify
on: [push, pull_request]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # testdata/gen_golden.py imports the Python reference oracle from the
      # sibling tau-alpha checkout (`ROOT.parent / "tau-alpha"`), exactly how
      # it's laid out for local development. actions/checkout's own `path:`
      # refuses to place a repo outside the current workspace, so this clones
      # it directly instead, landing at the same sibling path either way.
      - name: Check out tau-alpha (sibling, for testdata/gen_golden.py)
        run: git clone --depth 1 https://github.com/alfatreze/Tau-Alpha ../tau-alpha
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --features tau-core/serde
      - run: python3 testdata/gen_golden.py
      - run: git diff --exit-code -- testdata
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      # Behaviour checks against the dev mock (ui/scripts/workbench-test.cjs). Playwright is installed globally so
      # the app's own dependencies stay unchanged; the script finds it through NODE_PATH.
      - name: Install a browser for the behaviour checks
        run: npm install -g playwright && playwright install --with-deps chromium
      - name: Library workbench behaviour checks
        run: |
          npm run dev -- --port 5173 --strictPort > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173 > /dev/null && break; sleep 1; done
          NODE_PATH=$(npm root -g) node scripts/workbench-test.cjs
