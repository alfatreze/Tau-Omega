name: Verify
on: [push, pull_request]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # testdata/gen_golden.py imports the Python reference oracle from the
      # sibling tau-alpha checkout (`ROOT.parent / "tau-alpha"`), exactly how
      # it's laid out for local development; `path: ../tau-alpha` recreates
      # that sibling layout under the runner's workspace.
      - uses: actions/checkout@v4
        with:
          repository: alfatreze/Tau-Alpha
          path: ../tau-alpha
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --features tau-core/serde
      - run: python3 testdata/gen_golden.py
      - run: git diff --exit-code -- testdata
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
