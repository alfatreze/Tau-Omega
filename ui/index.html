<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="color-scheme" content="light dark"/><script>try{var v=localStorage.getItem("tau.theme");if(v==="light"||v==="dark")document.querySelector('meta[name="color-scheme"]').content=v;var av=localStorage.getItem("tau.accentVars");if(av){var o=JSON.parse(av),s=document.documentElement.style;for(var k in o)if(k.indexOf("--")===0)s.setProperty(k,o[k]);}}catch(e){}</script><title>Tau Omega</title></head><body><div id="app"></div><script type="module" src="/src/main.ts"></script></body></html>
