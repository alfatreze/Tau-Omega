[package]
name = "tau-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23"
crc32fast = "1.5"
png = "0.18"
tau-audio = { path = "../tau-audio" }
resize = { version = "0.8", default-features = false }
rgb = { version = "0.8", default-features = false }
rqrr = { version = "0.11", default-features = false }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zune-jpeg = "0.5"
deunicode = "1.6.2"
unicode-normalization = "0.1.25"

[features]
# Adds `Serialize`/`Deserialize` to every public data type (see
# docs/DEPENDENCIES.md). Zero cost when disabled: only serde's derive macros
# are left out (the `serde` crate itself is always there, because `serde_json`
# needs it and `name_sidecar` writes its JSON with it). This exists so a host
# (a Tauri adapter, or Pocket Sync itself) can hand these types straight across
# a serialisation boundary instead of hand-writing a DTO that mirrors every field.
serde = ["serde/derive"]

# Disk-space queries do not exist on WebAssembly (WASI): `storage` answers "unsupported" there instead, and every caller already treats a
# failed measurement as "cannot measure, do not block" (Tau Alpha message 015, A015/R-1).
[target.'cfg(not(target_os = "wasi"))'.dependencies]
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }

[lints]
workspace = true
